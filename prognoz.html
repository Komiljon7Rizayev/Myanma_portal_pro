<style>
:root{
  --bg:#f3efe6;--bg2:#fbf8f2;--card:#ffffff;--card2:#f4efe5;--line:rgba(60,48,30,.12);--line2:rgba(60,48,30,.24);
  --tx:#1f1b14;--tx2:#5f5648;--tx3:#8d8271;--acc:#c8553d;--acc2:#3f5f2f;--fc:#1b4fbf;--bad:#b83a2b;--good:#2f7d3a;
  --c0:#c44e3a;--c1:#eda65a;--c2:#d6d9c6;--c3:#86c57a;--c4:#2a8540;
  --display:'Sora',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14.5px/1.5 var(--body)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fc);outline-offset:2px}
.app{height:100vh;display:grid;grid-template-rows:64px 1fr;background:radial-gradient(1100px 520px at 75% -12%,rgba(217,138,43,.14),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(63,95,47,.1),transparent 60%),var(--bg)}
/* header */
.top{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(251,248,242,.92);backdrop-filter:blur(10px);min-width:0}
.top .sp{flex:1}
.pnav{display:flex;align-items:center;gap:8px;flex:none}
.pb{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:11px;text-decoration:none;font:500 14.5px var(--display);white-space:nowrap;transition:filter .15s,transform .15s}
.pb:hover{filter:brightness(1.1);transform:translateY(-1px)}
.pb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.pmain{padding-left:5px;color:#eaf6e4;background:linear-gradient(180deg,#2c4a31,#1b3420);border:1px solid rgba(127,208,108,.5);box-shadow:0 4px 14px rgba(27,52,32,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.pmain img{width:30px;height:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.pfc{color:#fff7ef;background:linear-gradient(180deg,#d4673f,#a9452a);border:1px solid #f0a07c;box-shadow:0 4px 14px rgba(169,69,42,.38),inset 0 1px 0 rgba(255,255,255,.2)}
.pfc[aria-current="page"]{cursor:default;transform:none;filter:none;outline:2px solid rgba(212,103,63,.35);outline-offset:2px}
.pfl{color:#e6f3ff;background:linear-gradient(180deg,#2f7fd0,#1d5ea8);border:1px solid #5aa2ea;box-shadow:0 4px 14px rgba(29,94,168,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.pill{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--tx2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);flex:none}
.hb{display:flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:13.5px;white-space:nowrap}
.hb:hover{border-color:var(--acc)}
.hb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hb.dark{background:var(--tx);color:var(--bg2);border-color:var(--tx)}
/* layout */
.grid{display:grid;grid-template-columns:316px 1fr clamp(400px,27vw,500px);min-height:0}
.rail,.insight{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.rail{border-right:1px solid var(--line)}
.insight{border-left:1px solid var(--line)}
.step{display:flex;align-items:center;gap:9px;margin:0 0 9px;font:600 13.5px var(--display)}
.step i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--tx);color:var(--bg2);font:600 12px var(--body);font-style:normal}
.hz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hz button{padding:9px 4px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;line-height:1.25;transition:.15s}
.hz button:hover{border-color:var(--line2)}
.hz button b{display:block;font:600 16px var(--display)}
.hz button span{display:block;font-size:12px;color:var(--tx2)}
.hz button em{display:block;margin-top:5px;font-style:normal;font-size:11px;font-weight:600;color:var(--tx3)}
.hz button em u{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line2);margin:0 1px;text-decoration:none}
.hz button em u.on{background:var(--good)}
.hz button[aria-pressed="true"]{background:#fbe9e3;border-color:var(--acc);box-shadow:0 6px 16px rgba(200,85,61,.16)}
.modes{display:flex;flex-direction:column;gap:6px}
.modes button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;transition:.15s}
.modes button:hover{border-color:var(--line2)}
.modes button[aria-pressed="true"]{border-color:var(--acc2);background:#eef3e6;box-shadow:inset 3px 0 0 var(--acc2)}
.modes .sw{width:32px;height:32px;border-radius:9px;flex:none;border:1px solid rgba(0,0,0,.06)}
.modes b{display:block;font-size:13.5px;font-weight:600}
.modes small{display:block;font-size:12px;color:var(--tx2);line-height:1.3}
select{width:100%;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:0 10px;font:inherit}
.tog{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tog label{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--acc2)}
.box{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.box h3{margin:0 0 8px;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.box .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;color:var(--tx2)}
.box .row b{color:var(--tx);font-weight:600;white-space:nowrap}
.stg{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 4px}
.stgl{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--tx2)}
.stgl i,.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* map */
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0}
.tip{position:absolute;z-index:5;pointer-events:none;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.97);border:1px solid var(--line2);font-size:12.5px;box-shadow:0 10px 26px rgba(60,48,30,.18);white-space:nowrap;line-height:1.45}
.badge{position:absolute;top:14px;left:14px;z-index:4;padding:9px 13px;border-radius:13px;background:rgba(255,255,255,.94);border:1px solid var(--line2);font-size:13px;color:var(--tx2);max-width:calc(100% - 80px);box-shadow:0 8px 22px rgba(60,48,30,.12)}
.badge b{color:var(--tx);font:600 15px var(--display)}
.lgd{position:absolute;left:14px;bottom:14px;z-index:4;width:292px;max-width:calc(100% - 28px);padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.95);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(60,48,30,.16);font-size:12.5px}
.lgd h4{margin:0 0 7px;font:600 13px var(--display)}
.lgd .bar{height:11px;border-radius:6px}
.lgd .ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx2);margin-top:4px}
.lgd button{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:6px;width:100%;padding:4px 5px;border-radius:8px;text-align:left;font-size:12.5px}
.lgd button:hover{background:var(--card2)}
.lgd button[aria-pressed="true"]{background:#fbe9e3;box-shadow:inset 0 0 0 1px var(--acc)}
.lgd button i{margin:0;width:14px;height:14px;border-radius:4px}
.lgd button small{color:var(--tx3);font-size:11.5px}
.lgd button b{font-weight:600}
.lgd .hint{margin-top:6px;font-size:11.5px;color:var(--tx3)}
.loading{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:var(--bg);font-size:14px;color:var(--tx2)}
.loading div{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(63,95,47,.25);border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vlab{padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.88);border:1px solid var(--line2);font:600 11px var(--body);color:var(--tx);white-space:nowrap;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.vlab:hover{background:#fff;border-color:var(--acc)}
.nolab .vlab,.farz .vlab{display:none}
/* right panel */
.hero{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(60,48,30,.06),0 10px 28px rgba(60,48,30,.07);border-left:6px solid var(--c2)}
.hero .k{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 12px var(--body);letter-spacing:0;text-transform:none;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%}
.hero h2{margin:8px 0 6px;font:500 19px/1.35 var(--display);letter-spacing:-.005em}
.hero p{margin:0;color:var(--tx2);font-size:13.5px}
.hero .big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hero .big div{padding:9px 10px;border-radius:12px;background:var(--card2);min-width:0}
.hero .big span{display:block;font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .big b{display:block;font:500 20px var(--display);margin-top:1px}
.hero .big small{display:block;font-size:11.5px;color:var(--tx2)}
.dist{margin-top:12px}
.dist .bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--card2)}
.dist .bar span{min-width:2px}
.dist .lb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px;font-size:12px;color:var(--tx2)}
.dist .lb b{display:block;font:600 15px var(--display);color:var(--tx)}
.up{color:var(--good)!important}.dn{color:var(--bad)!important}
.card{padding:13px 13px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(60,48,30,.06),0 8px 24px rgba(60,48,30,.05)}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.ch h4{margin:0;font:500 15px var(--display)}
.ch span{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.ctip{position:absolute;pointer-events:none;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.97);border:1px solid var(--line2);font-size:11.5px;white-space:nowrap;transform:translate(-50%,-100%)}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--tx2);margin-top:5px}
.lg span{display:flex;align-items:center;gap:5px}.lg i{width:14px;height:3px;border-radius:2px}
.tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--card2);margin-bottom:10px}
.tabs button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(60,48,30,.14)}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th,.tb td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--tx3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tb th[data-s]{cursor:pointer}.tb th[data-s]:hover{color:var(--tx)}
.tb tr.on td{background:#fbe9e3}
.tb tr.clk{cursor:pointer}.tb tr.clk:hover td{background:var(--card2)}
.tb .clim td{color:var(--tx3)}
.tb .mb{display:inline-block;width:54px;height:7px;border-radius:4px;background:var(--card2);vertical-align:middle;margin-right:6px;overflow:hidden}
.tb .mb i{display:block;height:100%;background:var(--c1)}
.vscroll{max-height:330px;overflow:auto}
.cap{font-size:12px;color:var(--tx3);margin:7px 0 0}
.lnk{font-size:12.5px;font-weight:600;color:var(--fc);text-decoration:underline;text-underline-offset:2px}
.acc{display:grid;grid-template-columns:62px 1fr;gap:7px 10px;align-items:center;font-size:12.5px;margin:4px 0 2px}
.acc .bars div{height:9px;border-radius:5px;margin:2px 0}
.acc .bars small{font-size:11.5px;color:var(--tx2)}
.hot{display:flex;flex-direction:column;gap:3px}
.hot button{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 7px;border-radius:9px;text-align:left;font-size:12.5px}
.hot button:hover{background:var(--card2)}
.hot small{color:var(--tx3)}
.pc{border-color:var(--acc);box-shadow:0 0 0 1px rgba(200,85,61,.12),0 14px 30px rgba(60,48,30,.15)}
.pc .x{float:right;width:28px;height:28px;border-radius:8px;color:var(--tx2);font-size:18px}
.pc .x:hover{background:var(--card2);color:var(--tx)}
.pc dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:9px 0 0;font-size:13px}
.pc dt{color:var(--tx2)}.pc dd{margin:0;font-weight:600;text-align:right}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--card2);color:var(--tx2)}
.tag.w{background:#e3eefc;color:#1b4fbf}.tag.l{background:#fdf3e3;color:#7a4b12}
/* drawers */
.drawer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(31,27,20,.45);backdrop-filter:blur(6px)}
.dbox{width:min(900px,100%);max-height:90vh;overflow:auto;padding:26px 30px;border-radius:20px;background:var(--bg2);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(31,27,20,.3)}
.dbox h2{margin:0 0 4px;font:500 23px var(--display)}
.dbox h3{margin:20px 0 6px;font:600 15px var(--display);color:var(--acc)}
.dbox p,.dbox li{color:var(--tx2);font-size:14px}
.dbox table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.dbox th,.dbox td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.dbox th:first-child,.dbox td:first-child{text-align:left}
.dbox th{color:var(--tx3);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.dact{float:right;display:flex;gap:8px}
.dact button{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);font-weight:600;background:var(--card)}
.dact .pr{background:var(--tx);color:var(--bg2);border-color:var(--tx)}
.warn{padding:10px 12px;border-radius:12px;background:#fdf3e3;border:1px solid #e8c58f;color:#7a4b12;font-size:13.5px}
.ok{padding:10px 12px;border-radius:12px;background:#eef3e6;border:1px solid #c5d6b0;color:#2d4a1f;font-size:13.5px}
.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.guide div{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.guide b{display:block;font:600 14.5px var(--display);margin-bottom:3px}
.guide i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font:600 12.5px var(--body);font-style:normal;margin-right:7px}
.guide p{margin:0;font-size:13.5px}
.gl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px;margin-top:6px}
.gl dt{font-weight:700;color:var(--tx)}.gl dd{margin:0;color:var(--tx2)}
.rep img{width:100%;border-radius:12px;border:1px solid var(--line);margin:10px 0}
.rep .rdist{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:8px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;padding:10px 16px;border-radius:12px;background:var(--tx);color:var(--bg2);font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
@media (max-width:1500px){.pill{display:none}}
@media (max-width:1250px){.grid{grid-template-columns:280px 1fr 380px}.hb span{display:none}.hb{padding:0 11px}}
@media (max-width:1000px){
  .app{height:auto;min-height:100vh;grid-template-rows:auto 1fr}
  .top{flex-wrap:wrap;padding:10px;gap:8px}
  .grid{grid-template-columns:1fr}
  .rail,.insight{border:0;overflow:visible}
  .mapwrap{height:70vh;order:-1}
  .insight{order:-2}
  .guide{grid-template-columns:1fr}.gl{grid-template-columns:1fr}
}
@media (max-width:640px){.pb .t{display:none}.pb{padding:0 10px}.pmain{padding:0 4px}.hero .big{grid-template-columns:1fr 1fr}.lgd{width:230px}}
@media print{
  .app{display:none!important}
  html,body{height:auto;background:#fff}
  .drawer{position:static;display:block;padding:0;background:none;backdrop-filter:none}
  .dbox{width:100%;max-height:none;overflow:visible;border:0;box-shadow:none;padding:0;background:#fff}
  .dact{display:none}
}
</style>

"{0} prognozi. «Past maydon ulushi» — qishloq ekin maydonining qancha qismi me'yordan past kutilmoqda. Ustun nomini bosib saralang, qatorni bosib qishloqqa o'ting.":["Forecast for {0}. “Share of low area” is the part of the village's cropland expected to be below normal. Click a column name to sort, click a row to open the village.","Прогноз на {0}. «Доля площади ниже нормы» — какая часть посевной площади села ожидается ниже нормы. Нажмите название столбца для сортировки, строку — чтобы перейти к селу.","{0} အတွက် ခန့်မှန်းချက်။ “ပုံမှန်အောက် ဧရိယာ အချိုး” သည် ကျေးရွာ၏ စိုက်ပျိုးမြေ၏ မည်မျှသည် ပုံမှန်အောက် ရောက်မည်ဟု ခန့်မှန်းထားသည်ကို ပြသည်။ စီရန် ကော်လံအမည်ကို နှိပ်ပါ၊ ကျေးရွာသို့သွားရန် အတန်းကို နှိပ်ပါ။"],
"Jadvalni yuklab olish (CSV)":["Download the table (CSV)","Скачать таблицу (CSV)","ဇယားကို ဒေါင်းလုဒ်လုပ်ရန် (CSV)"],
"Bu hududda me'yordan sezilarli past kutilayotgan dala yo'q.":["No field in this area is expected to be well below normal.","В этой территории нет полей, ожидаемых заметно ниже нормы.","ဤဒေသတွင် ပုံမှန်ထက် သိသိသာသာ နိမ့်မည့် လယ်ကွက် မရှိပါ။"],
"{0}: {1} uchun eng ko'p yo'qotish kutilayotgan dalalar (maydon × me'yordan pastlik). Bosing — xarita o'sha dalaga boradi.":["{0}: fields with the largest expected loss for {1} (area × shortfall below normal). Click one and the map goes to that field.","{0}: поля с наибольшими ожидаемыми потерями на {1} (площадь × отставание от нормы). Нажмите — карта перейдёт к полю.","{0}: {1} အတွက် ဆုံးရှုံးမှု အများဆုံး ဖြစ်နိုင်သော လယ်ကွက်များ (ဧရိယာ × ပုံမှန်အောက် ကွာဟချက်)။ နှိပ်လျှင် မြေပုံသည် ထိုလယ်ကွက်သို့ သွားမည်။"],
"Butun tuman":["Whole township","Весь район","မြို့နယ်တစ်ခုလုံး"],
"Butun tuman o'rtachasi. 30 kungacha — model prognozi (foiz: xato me'yorga qaraganda qancha kam). 60 va 90 kun uchun ob-havoni oldindan bilib bo'lmaydi, shuning uchun ko'p yillik me'yor ko'rsatiladi.":["Township average. Up to 30 days: model forecast (percent = how much smaller the error is than with the normal). For 60 and 90 days the weather cannot be known in advance, so the multi-year normal is shown.","Среднее по району. До 30 дней — прогноз модели (процент: насколько ошибка меньше, чем у нормы). На 60 и 90 дней погоду заранее узнать нельзя, поэтому показана многолетняя норма.","မြို့နယ် ပျမ်းမျှ။ ရက် ၃၀ အထိ — မော်ဒယ် ခန့်မှန်းချက် (ရာခိုင်နှုန်း = ပုံမှန်တန်ဖိုးထက် အမှား မည်မျှနည်းသည်)။ ရက် ၆၀ နှင့် ၉၀ အတွက် ရာသီဥတုကို ကြိုမသိနိုင်သဖြင့် နှစ်ရှည် ပုံမှန်တန်ဖိုးကို ပြထားသည်။"],
"Bitta dala uchun o'rtacha xato (NDVI birligida). Yashil — bizning model, kulrang — oddiy «har yilgidek» taxmini.":["Average error for one field (in NDVI units). Green: our model; grey: the simple “same as every year” guess.","Средняя ошибка для одного поля (в единицах NDVI). Зелёный — наша модель, серый — простое предположение «как каждый год».","လယ်ကွက်တစ်ကွက်အတွက် ပျမ်းမျှအမှား (NDVI ယူနစ်ဖြင့်)။ အစိမ်း — ကျွန်ုပ်တို့၏ မော်ဒယ်၊ မီးခိုး — “နှစ်စဉ်အတိုင်း” ဟူသော ရိုးရိုးခန့်မှန်းချက်။"],

"Model ko'rmagan 2026-yilning har bir o'nkunligida: 10 kunlik prognoz {0} sanadan {1} tasida, 20 kunlik {2} tasida, 30 kunlik {3} tasida me'yordan aniqroq chiqdi. Eng yomon sana ({4}) ham yashirilmagan.":["For every 10-day period of 2026, a year the model never saw: the 10-day forecast beat the normal on {1} of {0} dates, the 20-day on {2}, the 30-day on {3}. The worst date ({4}) is not hidden either.","По каждой декаде 2026 года, который модель не видела: прогноз на 10 дней оказался точнее нормы в {1} из {0} дат, на 20 дней — в {2}, на 30 дней — в {3}. Худшая дата ({4}) тоже не скрыта.","မော်ဒယ် မမြင်ဖူးသော ၂၀၂၆ ခုနှစ်၏ ၁၀ ရက်ပတ်တိုင်းအတွက်: ၁၀ ရက် ခန့်မှန်းချက်သည် ရက် {0} အနက် {1} ရက်တွင်၊ ရက် ၂၀ သည် {2} ရက်တွင်၊ ရက် ၃၀ သည် {3} ရက်တွင် ပုံမှန်တန်ဖိုးထက် ပိုတိကျခဲ့သည်။ အဆိုးဆုံးရက် ({4}) ကိုလည်း မဖုံးကွယ်ထားပါ။"],

"Sanani tanlang":["Choose the date","Выберите дату","ရက်စွဲကို ရွေးပါ"],
"Chapda 10, 20 yoki 30 kun. Yaqin sana — aniqroq; uzoq sana — taxminiyroq (nuqtalar ishonch darajasini ko'rsatadi).":["On the left: 10, 20 or 30 days. A nearer date is more accurate; a farther one is rougher (the dots show the confidence level).","Слева: 10, 20 или 30 дней. Ближняя дата точнее, дальняя — приблизительнее (точки показывают уровень надёжности).","ဘယ်ဘက်တွင် ၁၀၊ ၂၀ သို့မဟုတ် ၃၀ ရက်။ နီးသောရက်သည် ပိုတိကျပြီး ဝေးသောရက်သည် ပိုခန့်မှန်းခြေဖြစ်သည် (အစက်များက ယုံကြည်မှုအဆင့်ကို ပြသည်)။"],
"Xaritaga qarang":["Look at the map","Посмотрите на карту","မြေပုံကို ကြည့်ပါ"],
"Qizil va to'q sariq — dala odatdagidan yomonroq bo'lishi kutilmoqda. Yashil — odatdagidan yaxshi. Kulrang — me'yorda.":["Red and orange: the field is expected to be worse than usual. Green: better than usual. Grey: normal.","Красный и оранжевый — поле ожидается хуже обычного. Зелёный — лучше обычного. Серый — в норме.","အနီနှင့် လိမ္မော် — လယ်ကွက်သည် ပုံမှန်ထက် ဆိုးမည်ဟု ခန့်မှန်းသည်။ အစိမ်း — ပုံမှန်ထက် ကောင်းသည်။ မီးခိုး — ပုံမှန်။"],
"Hududni tanlang":["Choose the area","Выберите территорию","ဒေသကို ရွေးပါ"],
"Qishloq nomini xaritada yoki ro'yxatda bosing. O'ngdagi «Qisqa xulosa» shu hudud uchun oddiy tilda yoziladi.":["Click a village name on the map or in the list. The “Summary” on the right is then written in plain language for that area.","Нажмите название села на карте или в списке. «Краткий вывод» справа будет написан простым языком для этой территории.","မြေပုံ သို့မဟုတ် စာရင်းရှိ ကျေးရွာအမည်ကို နှိပ်ပါ။ ညာဘက်ရှိ “အကျဉ်းချုပ်” ကို ထိုဒေသအတွက် ရိုးရှင်းသော စကားဖြင့် ရေးပေးမည်။"],
"Dalani bosing":["Click a field","Нажмите на поле","လယ်ကွက်ကို နှိပ်ပါ"],
"Har bir dala uchun prognoz, ehtimoliy oraliq, me'yordan past bo'lish ehtimoli va 2 yillik tarix chiqadi.":["For every field you get the forecast, the likely range, the chance of being below normal and a 2-year history.","Для каждого поля показываются прогноз, вероятный интервал, вероятность оказаться ниже нормы и история за 2 года.","လယ်ကွက်တိုင်းအတွက် ခန့်မှန်းချက်၊ ဖြစ်နိုင်သော အပိုင်းအခြား၊ ပုံမှန်အောက် ရောက်နိုင်ခြေနှင့် ၂ နှစ် မှတ်တမ်းကို ပြမည်။"],
"O'ng paneldagi shu nomli bo'lim eng ko'p yo'qotish kutilayotgan dalalarni ro'yxat qilib beradi — bosilsa xarita o'sha yerga boradi.":["The section with this name in the right panel lists the fields with the largest expected loss; click one and the map goes there.","Раздел с таким названием в правой панели показывает поля с наибольшими ожидаемыми потерями — при нажатии карта переходит туда.","ညာဘက်ရှိ ဤအမည်ပါ အပိုင်းတွင် ဆုံးရှုံးမှု အများဆုံး ဖြစ်နိုင်သော လယ်ကွက်များကို စာရင်းပြထားသည် — နှိပ်လျှင် မြေပုံသည် ထိုနေရာသို့ သွားမည်။"],
"Hisobot oling":["Get the report","Получите отчёт","အစီရင်ခံစာ ရယူပါ"],
"Yuqoridagi «Hisobot» tugmasi rahbariyat uchun bir sahifali xulosani tayyorlaydi: chop etish yoki PDF qilib saqlash mumkin.":["The “Report” button at the top prepares a one-page summary for management: you can print it or save it as a PDF.","Кнопка «Отчёт» вверху готовит одностраничную сводку для руководства: её можно распечатать или сохранить в PDF.","အပေါ်ရှိ “အစီရင်ခံစာ” ခလုတ်သည် စီမံခန့်ခွဲသူများအတွက် တစ်မျက်နှာ အကျဉ်းချုပ်ကို ပြင်ဆင်ပေးသည် — ပုံနှိပ်နိုင်သည် သို့မဟုတ် PDF အဖြစ် သိမ်းနိုင်သည်။"],
"Normalized Difference Vegetation Index — normallashtirilgan vegetatsiya farqi indeksi. Oddiy qilib aytganda, yashillik ko'rsatkichi: 0 ga yaqin — yalang'och yer, 0,8 atrofida — qalin, sog'lom ekin.":["Normalized Difference Vegetation Index. Put simply, a greenness index: near 0 is bare soil, around 0.8 is a dense, healthy crop.","Normalized Difference Vegetation Index — нормализованный разностный вегетационный индекс. Проще говоря, показатель зелени: около 0 — голая земля, около 0,8 — густые, здоровые посевы.","Normalized Difference Vegetation Index (ပုံမှန်ပြုထားသော အပင်ကွာခြားမှု ညွှန်းကိန်း)။ ရိုးရိုးပြောရလျှင် စိမ်းလန်းမှု ညွှန်းကိန်းဖြစ်သည် — 0 နီးပါးသည် မြေလွတ်၊ 0.8 ဝန်းကျင်သည် စိမ်းအုပ်၍ ကျန်းမာသော သီးနှံ။"],
"Shu dalaning yilning aynan shu kunlaridagi ko'p yillik o'rtacha yashilligi (2019–2025). «Odatda qanday bo'ladi» degan savolga javob.":["The field's own multi-year average greenness for exactly these days of the year (2019–2025). It answers “what is it usually like”.","Многолетняя средняя зелень этого поля именно в эти дни года (2019–2025). Ответ на вопрос «как бывает обычно».","နှစ်၏ ဤရက်များအတွက် ထိုလယ်ကွက်၏ နှစ်ရှည် ပျမ်းမျှ စိမ်းလန်းမှု (2019–2025)။ “အများအားဖြင့် မည်သို့ရှိသနည်း” ဟူသော မေးခွန်း၏ အဖြေ။"],
"Prognoz me'yordan qancha farq qilishi. Farq ±0,04 ichida bo'lsa — «me'yorda»; 0,10 dan ko'p past bo'lsa — «ancha past».":["How far the forecast is from the normal. Within ±0.04 it is “normal”; more than 0.10 below it is “much lower”.","Насколько прогноз отличается от нормы. Если разница в пределах ±0,04 — «в норме»; ниже более чем на 0,10 — «намного ниже».","ခန့်မှန်းချက်သည် ပုံမှန်တန်ဖိုးမှ မည်မျှ ကွာသနည်း။ ±0.04 အတွင်းဆိုလျှင် “ပုံမှန်”၊ 0.10 ထက်ပို၍ နိမ့်လျှင် “အလွန်နိမ့်”။"],
"Ehtimoliy oraliq (80 %)":["Likely range (80 %)","Вероятный интервал (80 %)","ဖြစ်နိုင်သော အပိုင်းအခြား (80 %)"],
"Haqiqiy qiymat 10 holatdan taxminan 8 tasida shu oraliq ichida chiqadi. Oraliq qancha tor bo'lsa, prognoz shuncha ishonchli.":["In about 8 cases out of 10 the real value falls inside this range. The narrower the range, the more reliable the forecast.","Примерно в 8 случаях из 10 реальное значение попадает в этот интервал. Чем уже интервал, тем надёжнее прогноз.","၁၀ ကြိမ်တွင် ၈ ကြိမ်ခန့် တကယ့်တန်ဖိုးသည် ဤအပိုင်းအခြားအတွင်း ကျရောက်သည်။ အပိုင်းအခြား ကျဉ်းလေ ခန့်မှန်းချက် ယုံကြည်ရလေ။"],
"Dala me'yordan past bo'lib chiqish ehtimoli, foizda. 80 % dan yuqori bo'lsa — signal jiddiy.":["The chance, in percent, that the field ends up below normal. Above 80 % the signal is serious.","Вероятность (в процентах), что поле окажется ниже нормы. Выше 80 % — сигнал серьёзный.","လယ်ကွက်သည် ပုံမှန်အောက် ရောက်နိုင်ခြေ (ရာခိုင်နှုန်း)။ 80 % ထက်ကျော်လျှင် အချက်ပြမှုသည် အလေးအနက်ထားရမည်။"],
"Suv kelgan dala":["Field that received water","Поле, получившее воду","ရေရောက်သော လယ်ကွက်"],
"Oxirgi suratda namligi keskin oshgan dala (yomg'ir yoki sug'orish belgisi). Bunday dalalarda yashillik odatda 10–30 kunda ortadi.":["A field whose moisture rose sharply in the latest image (a sign of rain or irrigation). Greenness in such fields usually rises within 10–30 days.","Поле, влажность которого резко выросла на последнем снимке (признак дождя или полива). На таких полях зелень обычно растёт через 10–30 дней.","နောက်ဆုံးပုံတွင် အစိုဓာတ် သိသိသာသာ တက်လာသော လယ်ကွက် (မိုးရွာခြင်း သို့မဟုတ် ရေသွင်းခြင်း လက္ခဏာ)။ ထိုလယ်ကွက်များတွင် စိမ်းလန်းမှုသည် အများအားဖြင့် ၁၀–၃၀ ရက်အတွင်း တိုးလာသည်။"],
"Bu sahifa nima va qanday o'qiladi":["What this page is and how to read it","Что это за страница и как её читать","ဤစာမျက်နှာသည် ဘာလဲ၊ မည်သို့ ဖတ်ရမလဲ"],
"Sun'iy yo'ldosh suratlari, radar va ob-havo ma'lumotlari asosida Minbu tumanidagi har bir dala 10, 20 va 30 kundan keyin qanchalik yashil bo'lishi oldindan taxmin qilinadi. Maqsad — muammo ko'zga ko'rinmasidan oldin qaysi hududga e'tibor kerakligini bilish.":["Using satellite images, radar and weather data, we estimate in advance how green every field in Minbu township will be in 10, 20 and 30 days. The aim is to know which area needs attention before a problem becomes visible.","По спутниковым снимкам, радару и данным о погоде заранее оценивается, насколько зелёным будет каждое поле района Минбу через 10, 20 и 30 дней. Цель — узнать, какой территории нужно внимание, до того как проблема станет заметной.","ဂြိုဟ်တုပုံများ၊ ရေဒါနှင့် ရာသီဥတုဒေတာကို အသုံးပြု၍ မင်းဘူးမြို့နယ်ရှိ လယ်ကွက်တိုင်းသည် ၁၀၊ ၂၀ နှင့် ၃၀ ရက်အကြာတွင် မည်မျှ စိမ်းလန်းမည်ကို ကြိုတင်ခန့်မှန်းသည်။ ရည်ရွယ်ချက်မှာ ပြဿနာ မမြင်ရမီ မည်သည့်ဒေသကို အာရုံစိုက်ရမည်ကို သိရန်ဖြစ်သည်။"],
"Asosiy tushunchalar":["Key terms","Основные понятия","အဓိက ဝေါဟာရများ"],
"Nimani yodda tutish kerak":["What to keep in mind","Что важно помнить","သတိပြုရန်"],
"Bu — taxmin, kafolat emas. Bitta dala uchun xato o'rtacha ±0,05–0,07; butun tuman o'rtachasi uchun ancha kichik (±0,03). Shuning uchun qarorlarni yakka dala emas, hudud va qishloq darajasida, dala ko'rigi bilan birga qabul qilish tavsiya etiladi.":["This is an estimate, not a guarantee. For a single field the error is ±0.05–0.07 on average; for the township average it is much smaller (±0.03). Decisions are therefore best made at area and village level rather than for single fields, together with a field visit.","Это оценка, а не гарантия. Для одного поля ошибка в среднем ±0,05–0,07; для среднего по району намного меньше (±0,03). Поэтому решения рекомендуется принимать на уровне территории и села, а не отдельного поля, и вместе с выездом на поле.","၎င်းသည် ခန့်မှန်းချက်သာဖြစ်ပြီး အာမခံချက် မဟုတ်ပါ။ လယ်ကွက်တစ်ကွက်အတွက် အမှားသည် ပျမ်းမျှ ±0.05–0.07 ဖြစ်ပြီး မြို့နယ်ပျမ်းမျှအတွက် များစွာ သေးငယ်သည် (±0.03)။ ထို့ကြောင့် ဆုံးဖြတ်ချက်များကို လယ်ကွက်တစ်ကွက်ချင်းအစား ဒေသနှင့် ကျေးရွာအဆင့်တွင် ကွင်းဆင်းစစ်ဆေးမှုနှင့်အတူ ချမှတ်ရန် အကြံပြုသည်။"],
"Minbu: ekinlar yashilligi prognozi":["Minbu: crop greenness forecast","Минбу: прогноз зелени посевов","မင်းဘူး: သီးနှံ စိမ်းလန်းမှု ခန့်မှန်းချက်"],

"{0} kunlik prognozda bitta dala uchun o'rtacha xato ±{1} (me'yor bilan taxmin qilinsa ±{2}), ya'ni {3} % aniqroq. Model ko'rmagan 2026-yilda ham {4} % aniqroq chiqdi. Bu taxmin — qaror qabul qilishda dala ko'rigi bilan birga foydalaning.":["In the {0}-day forecast the average error for one field is ±{1} (±{2} if the normal is used as the guess), i.e. {3} % more accurate. In 2026, a year the model never saw, it was also {4} % more accurate. This is an estimate: use it together with a field visit when making decisions.","В прогнозе на {0} дней средняя ошибка для одного поля ±{1} (при оценке по норме ±{2}), то есть на {3} % точнее. В 2026 году, который модель не видела, тоже вышло на {4} % точнее. Это оценка — используйте её при принятии решений вместе с выездом на поле.","{0} ရက် ခန့်မှန်းချက်တွင် လယ်ကွက်တစ်ကွက်အတွက် ပျမ်းမျှအမှားသည် ±{1} ဖြစ်သည် (ပုံမှန်တန်ဖိုးဖြင့် ခန့်မှန်းလျှင် ±{2})၊ ဆိုလိုသည်မှာ {3} % ပိုတိကျသည်။ မော်ဒယ် မမြင်ဖူးသော ၂၀၂၆ ခုနှစ်တွင်လည်း {4} % ပိုတိကျခဲ့သည်။ ၎င်းသည် ခန့်မှန်းချက်ဖြစ်သဖြင့် ဆုံးဖြတ်ချက်ချရာတွင် ကွင်းဆင်းစစ်ဆေးမှုနှင့်အတူ အသုံးပြုပါ။"],
"Manba: Sentinel-2 va Sentinel-1 sun'iy yo'ldoshlari, ERA5-Land ob-havo ma'lumoti · Minbu Portal, Index Forecast.":["Source: Sentinel-2 and Sentinel-1 satellites, ERA5-Land weather data · Minbu Portal, Index Forecast.","Источник: спутники Sentinel-2 и Sentinel-1, данные о погоде ERA5-Land · Minbu Portal, Index Forecast.","ရင်းမြစ်: Sentinel-2 နှင့် Sentinel-1 ဂြိုဟ်တုများ၊ ERA5-Land ရာသီဥတုဒေတာ · Minbu Portal, Index Forecast။"],

"Yangilangan: {0} · {1} dala (kontur) · prognoz {2} holatidan.":["Updated: {0} · {1} fields (contours) · forecast based on {2}.","Обновлено: {0} · {1} полей (контуров) · прогноз по состоянию на {2}.","အပ်ဒိတ်: {0} · လယ်ကွက် {1} ကွက် · {2} အခြေအနေအရ ခန့်မှန်းချက်။"],
"Savol":["The question","Вопрос","မေးခွန်း"],
"Dalaga suv (yomg'ir yoki sug'orish) kelsa, o'simlik yashilligi (NDVI) qancha vaqtda va qancha o'zgaradi? Shu bog'lanish 2019–2026 yillar ma'lumotidan o'rganilib, har bir dala uchun 10, 20 va 30 kun keyingi NDVI taxmin qilinadi.":["When water (rain or irrigation) reaches a field, how soon and by how much does crop greenness (NDVI) change? This relationship is learned from 2019–2026 data, and NDVI 10, 20 and 30 days ahead is estimated for every field.","Когда на поле приходит вода (дождь или полив), как скоро и насколько меняется зелень растений (NDVI)? Эта связь изучена по данным 2019–2026 годов, и для каждого поля оценивается NDVI через 10, 20 и 30 дней.","လယ်ကွက်သို့ ရေ (မိုး သို့မဟုတ် ရေသွင်းခြင်း) ရောက်သောအခါ အပင်စိမ်းလန်းမှု (NDVI) သည် မည်မျှကြာ၍ မည်မျှ ပြောင်းလဲသနည်း။ ဤဆက်စပ်မှုကို 2019–2026 ဒေတာမှ သင်ယူပြီး လယ်ကွက်တိုင်းအတွက် ၁၀၊ ၂၀ နှင့် ၃၀ ရက်အကြာ NDVI ကို ခန့်မှန်းသည်။"],
"Ma'lumotlar":["Data","Данные","ဒေတာ"],
"<b>Sentinel-2</b> — optik sun'iy yo'ldosh: NDVI (Normalized Difference Vegetation Index, normallashtirilgan vegetatsiya farqi indeksi — yashillik) va NDMI (Normalized Difference Moisture Index, normallashtirilgan namlik farqi indeksi — barg va tuproq namligi). Bulutli piksellar olib tashlangan.":["<b>Sentinel-2</b>: an optical satellite. NDVI (Normalized Difference Vegetation Index, greenness) and NDMI (Normalized Difference Moisture Index, leaf and soil moisture). Cloudy pixels are removed.","<b>Sentinel-2</b> — оптический спутник: NDVI (Normalized Difference Vegetation Index, нормализованный разностный вегетационный индекс — зелень) и NDMI (Normalized Difference Moisture Index, нормализованный разностный индекс влажности — влажность листьев и почвы). Облачные пиксели удалены.","<b>Sentinel-2</b> — အလင်းသုံး ဂြိုဟ်တု: NDVI (Normalized Difference Vegetation Index၊ စိမ်းလန်းမှု) နှင့် NDMI (Normalized Difference Moisture Index၊ အရွက်နှင့် မြေအစိုဓာတ်)။ တိမ်ဖုံးသော pixel များကို ဖယ်ရှားထားသည်။"],
"<b>Sentinel-1</b> — radar (SAR, Synthetic Aperture Radar, sintetik aperturali radar): bulut orqali ham ko'radi, shuning uchun yomg'irli mavsumda surat yo'q paytlarni to'ldiradi.":["<b>Sentinel-1</b>: radar (SAR, Synthetic Aperture Radar). It sees through cloud, so it fills the gaps when there are no images in the rainy season.","<b>Sentinel-1</b> — радар (SAR, Synthetic Aperture Radar, радар с синтезированной апертурой): видит сквозь облака, поэтому заполняет пробелы без снимков в сезон дождей.","<b>Sentinel-1</b> — ရေဒါ (SAR, Synthetic Aperture Radar): တိမ်ကို ဖောက်၍ မြင်နိုင်သဖြင့် မိုးရာသီတွင် ပုံမရှိသော အချိန်များကို ဖြည့်ပေးသည်။"],
"<b>ERA5-Land</b> — ECMWF (Yevropa o'rta muddatli ob-havo prognozlari markazi) qayta tahlili: harorat, havo quruqligi, quyosh radiatsiyasi, tuproq namligi; <b>IMERG</b> — NASA sun'iy yo'ldosh yog'in ma'lumoti.":["<b>ERA5-Land</b>: reanalysis by ECMWF (European Centre for Medium-Range Weather Forecasts) with temperature, air dryness, solar radiation and soil moisture; <b>IMERG</b>: NASA satellite rainfall data.","<b>ERA5-Land</b> — реанализ ECMWF (Европейский центр среднесрочных прогнозов погоды): температура, сухость воздуха, солнечная радиация, влажность почвы; <b>IMERG</b> — спутниковые данные NASA об осадках.","<b>ERA5-Land</b> — ECMWF (ဥရောပ အလယ်အလတ်ကာလ မိုးလေဝသ ခန့်မှန်းရေးစင်တာ) ၏ ပြန်လည်ဆန်းစစ်ချက်: အပူချိန်၊ လေခြောက်သွေ့မှု၊ နေရောင်ခြည်၊ မြေအစိုဓာတ်; <b>IMERG</b> — NASA ၏ ဂြိုဟ်တု မိုးရေချိန်ဒေတာ။"],
"Model":["Model","Модель","မော်ဒယ်"],
"Vaqt o'nkunliklarga (10 kunlik bo'laklar) bo'lingan. Har bir dala uchun <b>me'yor</b> — shu o'nkunlikdagi 2019–2025 o'rtachasi.":["Time is split into 10-day periods. For every field the <b>normal</b> is its 2019–2025 average for that 10-day period.","Время разделено на декады (10-дневные отрезки). Для каждого поля <b>норма</b> — среднее за 2019–2025 годы в эту декаду.","အချိန်ကို ၁၀ ရက်ပတ်များအဖြစ် ပိုင်းထားသည်။ လယ်ကွက်တိုင်းအတွက် <b>ပုံမှန်တန်ဖိုး</b> သည် ထို ၁၀ ရက်ပတ်၏ 2019–2025 ပျမ်းမျှဖြစ်သည်။"],
"Model me'yordan <b>farqni</b> taxmin qiladi: hozirgi farq, o'simlik bosqichi (ko'karish, eng yashil payt, sarg'ayish), oxirgi 30 kun yog'ini, namlik sakrashi (suv kelgani belgisi), radar va ob-havo.":["The model estimates the <b>difference</b> from the normal using the current difference, the crop stage (green-up, peak green, yellowing), rain in the last 30 days, a jump in moisture (a sign that water arrived), radar and weather.","Модель оценивает <b>отклонение</b> от нормы: текущее отклонение, стадия растений (рост зелени, пик зелени, пожелтение), осадки за последние 30 дней, скачок влажности (признак прихода воды), радар и погода.","မော်ဒယ်သည် ပုံမှန်တန်ဖိုးမှ <b>ကွာခြားချက်</b> ကို ခန့်မှန်းသည်: လက်ရှိကွာခြားချက်၊ သီးနှံအဆင့် (စိမ်းလာချိန်၊ အစိမ်းဆုံးချိန်၊ ဝါလာချိန်)၊ နောက်ဆုံး ရက် ၃၀ မိုးရေချိန်၊ အစိုဓာတ် ခုန်တက်မှု (ရေရောက်သည့် လက္ခဏာ)၊ ရေဒါနှင့် ရာသီဥတု။"],
"Usul — GBM (Gradient Boosting Machine, gradiyent kuchaytirish mashinasi; LightGBM kutubxonasi): ko'p sonli kichik qaror daraxtlari ketma-ket bir-birining xatosini tuzatadi.":["Method: GBM (Gradient Boosting Machine; the LightGBM library), in which many small decision trees correct each other's errors one after another.","Метод — GBM (Gradient Boosting Machine, градиентный бустинг; библиотека LightGBM): множество небольших деревьев решений последовательно исправляют ошибки друг друга.","နည်းလမ်း — GBM (Gradient Boosting Machine; LightGBM library): ဆုံးဖြတ်ချက်သစ်ပင်ငယ် အများအပြားက တစ်ခုပြီးတစ်ခု အချင်းချင်း၏ အမှားကို ပြင်ပေးသည်။"],
"<b>80 % oraliq</b> — sinovdagi haqiqiy xatolar taqsimotidan olingan. <b>Xavf ehtimoli</b> shu oraliqdan taxminan (normal taqsimot yaqinlashuvi bilan) hisoblanadi.":["The <b>80 % range</b> comes from the distribution of real errors in testing. The <b>risk probability</b> is computed approximately from this range (normal-distribution approximation).","<b>Интервал 80 %</b> получен из распределения реальных ошибок при проверке. <b>Вероятность риска</b> вычисляется по этому интервалу приближённо (аппроксимация нормальным распределением).","<b>80 % အပိုင်းအခြား</b> ကို စမ်းသပ်မှုရှိ တကယ့်အမှားများ၏ ဖြန့်ကျက်မှုမှ ရယူသည်။ <b>အန္တရာယ် ဖြစ်နိုင်ခြေ</b> ကို ထိုအပိုင်းအခြားမှ ခန့်မှန်းခြေအားဖြင့် (normal distribution ဖြင့်) တွက်ချက်သည်။"],
"Aniqlik (har yil chetga olinib sinalgan, 2019–2025; alohida 2026)":["Accuracy (each year left out and tested, 2019–2025; 2026 separately)","Точность (каждый год исключался и проверялся, 2019–2025; отдельно 2026)","တိကျမှု (2019–2025 နှစ်တစ်နှစ်စီကို ချန်ထား၍ စမ်းသပ်; 2026 သီးသန့်)"],
"MAE (Mean Absolute Error, o'rtacha mutlaq xato) — prognoz haqiqatdan o'rtacha qancha farq qiladi.":["MAE (Mean Absolute Error): how far, on average, the forecast is from reality.","MAE (Mean Absolute Error, средняя абсолютная ошибка) — насколько в среднем прогноз отличается от факта.","MAE (Mean Absolute Error၊ ပျမ်းမျှ ပကတိအမှား) — ခန့်မှန်းချက်သည် အမှန်တကယ်မှ ပျမ်းမျှ မည်မျှ ကွာသနည်း။"],
"Muddat":["Horizon","Срок","ကာလ"],
"Me'yor xatosi":["Error of the normal","Ошибка нормы","ပုံမှန်တန်ဖိုး၏ အမှား"],
"Model xatosi":["Model error","Ошибка модели","မော်ဒယ်၏ အမှား"],
"Yutuq":["Gain","Выигрыш","အမြတ်"],
"Tuman":["Township","Район","မြို့နယ်"],
"Ko'rsatiladi":["Shown","Показывается","ပြသသည်"],
"Cheklovlar":["Limitations","Ограничения","ကန့်သတ်ချက်များ"],
"Sug'orish miqdori va dala ma'lumoti (ekin turi, ekish sanasi) yo'q — suv kelishi faqat NDMI sakrashidan bilinadi.":["There are no data on irrigation amounts or on the fields (crop type, sowing date): the arrival of water is known only from a jump in NDMI.","Нет данных об объёмах полива и о полях (культура, дата сева) — приход воды определяется только по скачку NDMI.","ရေသွင်းပမာဏနှင့် လယ်ကွက်ဒေတာ (သီးနှံအမျိုးအစား၊ စိုက်ရက်) မရှိပါ — ရေရောက်ခြင်းကို NDMI ခုန်တက်မှုမှသာ သိနိုင်သည်။"],
"Bitta dala uchun ±0,01 aniqlikka bir oy oldin erishib bo'lmaydi: NDVI o'zgarishining ~91 % qismi dalaning o'ziga xos sabablariga bog'liq.":["An accuracy of ±0.01 for a single field one month ahead is not achievable: about 91 % of NDVI variation depends on causes specific to each field.","Точность ±0,01 для одного поля за месяц вперёд недостижима: около 91 % изменчивости NDVI зависит от причин, специфичных для каждого поля.","လယ်ကွက်တစ်ကွက်အတွက် တစ်လကြိုတင်၍ ±0.01 တိကျမှုကို မရနိုင်ပါ: NDVI ပြောင်းလဲမှု၏ ~91 % သည် လယ်ကွက်တစ်ခုချင်း၏ ကိုယ်ပိုင်အကြောင်းရင်းများပေါ် မူတည်သည်။"],
"Yakka sanalarda natija o'zgarib turadi (masalan, 2026-yil 21-oktabr prognozi me'yordan yomon chiqdi).":["Results vary on single dates (for example, the forecast for 21 October 2026 was worse than the normal).","На отдельные даты результат меняется (например, прогноз на 21 октября 2026 года оказался хуже нормы).","ရက်တစ်ရက်ချင်းအလိုက် ရလဒ် ကွဲပြားသည် (ဥပမာ 2026 အောက်တိုဘာ 21 ရက်အတွက် ခန့်မှန်းချက်သည် ပုံမှန်တန်ဖိုးထက် ဆိုးခဲ့သည်)။"],
"Ob-havo ERA5-Land ~10 kun kechikib keladi; yangi ob-havo to'liq kelgach prognoz yangilanadi.":["ERA5-Land weather arrives about 10 days late; the forecast is updated once the new weather is complete.","Погода ERA5-Land приходит с задержкой около 10 дней; прогноз обновляется, когда новые данные поступят полностью.","ERA5-Land ရာသီဥတုဒေတာသည် ၁၀ ရက်ခန့် နောက်ကျ၍ ရောက်သည်; ဒေတာအသစ် အပြည့်အစုံရောက်သောအခါ ခန့်မှန်းချက်ကို အပ်ဒိတ်လုပ်မည်။"]
};

      '<h3>'+L("Ishonchlilik")+'</h3><p>'+L("{0} kunlik prognozda bitta dala uchun o'rtacha xato ±{1} (me'yor bilan taxmin qilinsa ±{2}), ya'ni {3} % aniqroq. Model ko'rmagan 2026-yilda ham {4} % aniqroq chiqdi. Bu taxmin — qaror qabul qilishda dala ko'rigi bilan birga foydalaning.",k.days,f(k.mae,3),f(k.mae_norm,3),f(k.cv,0),f(k.hold,0))+'</p>'+
      '<p style="font-size:12px">'+L("Manba: Sentinel-2 va Sentinel-1 sun'iy yo'ldoshlari, ERA5-Land ob-havo ma'lumoti · Minbu Portal, Index Forecast.")+'</p></div>',true);
    if(sv>=0)pick(sv);
  };
  if(again){build(RIMG);return}   /* language change while the report is open: keep the same map picture */
  if(map){map.once('render',function(){var u=null;try{u=map.getCanvas().toDataURL('image/jpeg',.88)}catch(e){}build(u)});map.triggerRepaint()}else build(null);
}
function openMethod(){
  DCUR=openMethod;
  var rows=META.skill.map(function(k){var far=k.days>30;return '<tr'+(far?' style="color:var(--tx3)"':'')+'><td>'+L("{0} kun",k.days)+'</td><td>'+f(k.mae_norm,3)+'</td><td>'+f(k.mae,3)+'</td><td class="'+(k.cv>1?'up':'')+'">'+sg(k.cv,1)+' %</td><td>'+sg(k.hold,1)+' %</td><td>'+sg(k.cv_town,1)+' %</td><td>'+(far?L("me'yor"):L("model"))+'</td></tr>'}).join('');
  var li=function(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'};
  openD('<h2>'+L("Prognoz qanday tuziladi")+'</h2><p>'+L("Yangilangan: {0} · {1} dala (kontur) · prognoz {2} holatidan.",META.generated,f(META.nf),ds(META.origin,1))+'</p>'+
    '<h3>1. '+L("Savol")+'</h3><p>'+L("Dalaga suv (yomg'ir yoki sug'orish) kelsa, o'simlik yashilligi (NDVI) qancha vaqtda va qancha o'zgaradi? Shu bog'lanish 2019–2026 yillar ma'lumotidan o'rganilib, har bir dala uchun 10, 20 va 30 kun keyingi NDVI taxmin qilinadi.")+'</p>'+
    '<h3>2. '+L("Ma'lumotlar")+'</h3>'+li([
      L("<b>Sentinel-2</b> — optik sun'iy yo'ldosh: NDVI (Normalized Difference Vegetation Index, normallashtirilgan vegetatsiya farqi indeksi — yashillik) va NDMI (Normalized Difference Moisture Index, normallashtirilgan namlik farqi indeksi — barg va tuproq namligi). Bulutli piksellar olib tashlangan."),
      L("<b>Sentinel-1</b> — radar (SAR, Synthetic Aperture Radar, sintetik aperturali radar): bulut orqali ham ko'radi, shuning uchun yomg'irli mavsumda surat yo'q paytlarni to'ldiradi."),
      L("<b>ERA5-Land</b> — ECMWF (Yevropa o'rta muddatli ob-havo prognozlari markazi) qayta tahlili: harorat, havo quruqligi, quyosh radiatsiyasi, tuproq namligi; <b>IMERG</b> — NASA sun'iy yo'ldosh yog'in ma'lumoti.")])+
    '<h3>3. '+L("Model")+'</h3>'+li([
      L("Vaqt o'nkunliklarga (10 kunlik bo'laklar) bo'lingan. Har bir dala uchun <b>me'yor</b> — shu o'nkunlikdagi 2019–2025 o'rtachasi."),
      L("Model me'yordan <b>farqni</b> taxmin qiladi: hozirgi farq, o'simlik bosqichi (ko'karish, eng yashil payt, sarg'ayish), oxirgi 30 kun yog'ini, namlik sakrashi (suv kelgani belgisi), radar va ob-havo."),
      L("Usul — GBM (Gradient Boosting Machine, gradiyent kuchaytirish mashinasi; LightGBM kutubxonasi): ko'p sonli kichik qaror daraxtlari ketma-ket bir-birining xatosini tuzatadi."),
      L("<b>80 % oraliq</b> — sinovdagi haqiqiy xatolar taqsimotidan olingan. <b>Xavf ehtimoli</b> shu oraliqdan taxminan (normal taqsimot yaqinlashuvi bilan) hisoblanadi.")])+
    '<h3>4. '+L("Aniqlik (har yil chetga olinib sinalgan, 2019–2025; alohida 2026)")+'</h3><p>'+L("MAE (Mean Absolute Error, o'rtacha mutlaq xato) — prognoz haqiqatdan o'rtacha qancha farq qiladi.")+'</p>'+
    '<table><tr><th>'+L("Muddat")+'</th><th>'+L("Me'yor xatosi")+'</th><th>'+L("Model xatosi")+'</th><th>'+L("Yutuq")+'</th><th>2026</th><th>'+L("Tuman")+'</th><th>'+L("Ko'rsatiladi")+'</th></tr>'+rows+'</table>'+
    '<h3>5. '+L("Cheklovlar")+'</h3><div class="warn"><ul style="margin:0;padding-left:18px">'+[
      L("Sug'orish miqdori va dala ma'lumoti (ekin turi, ekish sanasi) yo'q — suv kelishi faqat NDMI sakrashidan bilinadi."),
      L("Bitta dala uchun ±0,01 aniqlikka bir oy oldin erishib bo'lmaydi: NDVI o'zgarishining ~91 % qismi dalaning o'ziga xos sabablariga bog'liq."),
      L("Yakka sanalarda natija o'zgarib turadi (masalan, 2026-yil 21-oktabr prognozi me'yordan yomon chiqdi)."),
      L("Ob-havo ERA5-Land ~10 kun kechikib keladi; yangi ob-havo to'liq kelgach prognoz yangilanadi.")].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>');
}
